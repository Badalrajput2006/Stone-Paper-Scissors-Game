<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Paper-Scissors</title>
    <link rel="stylesheet" href="./CSS/game2css.css">
</head>
<body>
    <h1>Stone-Paper-Scissors Game</h1>
    <div class="choices">
        <div class="choice" id="stone"> <img src="./Images/rock.png" ></div>
        <div class="choice" id="paper"><img src="./Images/paper.png" ></div>
        <div class="choice" id="scissors"><img src="./Images/scissors.png" ></div>
    </div>
    <div class="score">
        <div>
            <p id="your_score">0</p>
            <p>you</p>
        </div>
        <div>
            <p id="compt_score">0</p>
            <p>Computer</p>
        </div>
    </div>
    <div class="msg">
        <p id="msg">Your Turn</p>
    </div>
    <script src="./game2js.js"></script>
</body>
</html>
